name: Release Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease

      - name: Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-github-arm64-v8a
          path: app/build/outputs/apk/github/release/app-github-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-github-x86_64
          path: app/build/outputs/apk/github/release/app-github-x86_64-release.apk
          if-no-files-found: error

      - name: Upload universal
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-github-universal
          path: app/build/outputs/apk/github/release/app-github-universal-release.apk
          if-no-files-found: error

      - name: Upload mapping
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-github-mapping
          path: app/build/outputs/mapping/githubRelease/mapping.txt
          if-no-files-found: error
